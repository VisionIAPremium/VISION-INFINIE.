name: Python tests and container validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q core app.py cli.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run read-only operational audit
        run: python cli.py audit
      - name: Build container image without publishing
        run: docker build --tag vision-infinie:ci .
